name: Release

on:
  push:
    # Accept both `v1.2.3` and `1.2.3` tag styles. The version-verify
    # step below enforces semver shape + match against VERSION file.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME#v}"
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag ($TAG) is not semver x.y.z"; exit 1; }
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (cyrius.cyml pulls from VERSION via \${file:VERSION})"

      - name: Install Cyrius toolchain
        # Hardened install (patra/sigil pattern): pre-flight the release
        # asset URL + verify the gzip tarball before extraction, so a
        # misconfigured `cyrius =` pin surfaces clearly. Versioned
        # $HOME/.cyrius/versions/<v>/ layout with bin/lib symlinks.
        run: |
          set -e
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          TARBALL="cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          URL="https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/$TARBALL"
          HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" -I "$URL")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "::error::Cyrius release $CYRIUS_VERSION not found on GitHub (HTTP $HTTP_CODE)."
            echo "::error::Asset URL: $URL"
            echo "::error::Fix: roll cyrius.cyml's 'cyrius =' pin back to a tagged version, or wait for $CYRIUS_VERSION to be tagged."
            exit 1
          fi
          curl -sLO "$URL"
          if ! file "$TARBALL" | grep -q "gzip compressed"; then
            echo "::error::Downloaded $TARBALL is not a gzip archive."
            head -c 200 "$TARBALL" || true
            exit 1
          fi
          tar xzf "$TARBALL"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/" 2>/dev/null || true
          cp "$CYRIUS_DIR/scripts/cyrius" "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/cyrius" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib/" 2>/dev/null || true
          chmod +x "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"* 2>/dev/null || true
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/bin"
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" "$HOME/.cyrius/lib"
          echo "$CYRIUS_VERSION" > "$HOME/.cyrius/current"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Setup lib symlink
        # nous de-vendored lib/ at 1.2.0; symlink the installed stdlib.
        run: ln -sf "$HOME/.cyrius/lib" lib

      - name: Resolve deps
        run: cyrius deps

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/nous
          strip build/nous 2>/dev/null || true
          echo "nous: $(wc -c < build/nous) bytes"

      - name: Test
        # See ci.yml's Test suite step: `cyrius test` summary leads
        # with a non-printable byte; force grep into text mode so the
        # binary-file heuristic doesn't drop the matching line.
        run: |
          out=$(cyrius test tests/nous.tcyr 2>&1)
          echo "$out"
          echo "$out" | grep -a -E "passed,.*failed" | grep -a -q "0 failed"

      - name: Smoke test
        run: ./build/nous | grep -q "all smoke checks passed"

      - name: Regenerate bundle
        # Rebuild dist/nous.cyr from [lib] modules so the shipped bundle
        # matches the tagged source exactly. Then assert the committed
        # copy is in sync (the same gate ci.yml enforces).
        run: |
          cyrius distlib
          git diff --exit-code dist/nous.cyr || {
            echo "::error::dist/nous.cyr is stale — run 'cyrius distlib' and commit before tagging."; exit 1; }

      - name: Clean toolchain artifacts
        run: rm -f cyrius-*.tar.gz

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="nous-${TAG}/" -o "nous-${TAG}-src.tar.gz" HEAD
          cp build/nous "nous-${TAG}-x86_64-linux"
          cp dist/nous.cyr "nous-${TAG}.cyr"
          sha256sum nous-*.tar.gz nous-*.cyr nous-*-linux > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            nous-*.tar.gz
            nous-*.cyr
            nous-*-linux
            SHA256SUMS

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Extract changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
          [ -s /tmp/body.md ] || echo "No changelog entry for $TAG." > /tmp/body.md

      - uses: softprops/action-gh-release@v2
        with:
          name: "nous ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v0.') }}
          files: |
            nous-*.tar.gz
            nous-*.cyr
            nous-*-linux
            SHA256SUMS
