name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Hardened install (patra/sigil pattern): pre-flight the release
        # asset URL and verify the download is a real gzip tarball before
        # extraction, so a misconfigured `cyrius =` pin surfaces as a clear
        # error instead of tar's misleading "not in gzip format". Installs
        # into a versioned $HOME/.cyrius/versions/<v>/ layout with bin/lib
        # symlinks (multi-version safe).
        run: |
          set -e
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          TARBALL="cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          URL="https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/$TARBALL"
          HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" -I "$URL")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "::error::Cyrius release $CYRIUS_VERSION not found on GitHub (HTTP $HTTP_CODE)."
            echo "::error::Asset URL: $URL"
            echo "::error::This usually means cyrius.cyml's 'cyrius =' pin was bumped ahead of the published release."
            echo "::error::Fix: roll the pin back to a tagged cyrius version (https://github.com/MacCracken/cyrius/releases) or wait for $CYRIUS_VERSION to be tagged."
            exit 1
          fi
          curl -sLO "$URL"
          if ! file "$TARBALL" | grep -q "gzip compressed"; then
            echo "::error::Downloaded $TARBALL is not a gzip archive."
            echo "::error::First 200 bytes (likely a GitHub error page):"
            head -c 200 "$TARBALL" || true
            exit 1
          fi
          tar xzf "$TARBALL"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/" 2>/dev/null || true
          cp "$CYRIUS_DIR/scripts/cyrius" "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/cyrius" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib/" 2>/dev/null || true
          chmod +x "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"* 2>/dev/null || true
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/bin"
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" "$HOME/.cyrius/lib"
          echo "$CYRIUS_VERSION" > "$HOME/.cyrius/current"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Setup lib symlink
        # nous no longer commits lib/ (1.2.0 de-vendor). Symlink the
        # installed stdlib snapshot so every step (lint/vet/build/distlib/
        # test) resolves `include "lib/X.cyr"`. All 17 declared stdlib
        # modules ship in the snapshot.
        run: ln -sf "$HOME/.cyrius/lib" lib

      - name: Resolve dependencies
        # No-op today (no [deps.NAME] git blocks; stdlib comes from the
        # snapshot above), but kept so a future external dep is picked up.
        run: cyrius deps

      - name: Lint
        # 1.2.1: promoted to per-module fail-on-warn (was barrel-only).
        # Auto-discover every src module + test entry; fail on any
        # "  warn " line. Per-module lint is clean as of the 1.2.1 hygiene
        # sweep (blank-line warnings cleared).
        run: |
          fail=0
          for f in src/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr; do
            [ -f "$f" ] || continue
            out=$(cyrius lint "$f" 2>&1)
            echo "$out"
            if echo "$out" | grep -qE '^\s*warn '; then
              echo "::error::lint warnings in $f"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Format check
        # 1.2.1: promoted from advisory to fail-on-drift after the
        # `cyrius fmt` sweep. `cyrius fmt <f> --check` is exit-code based:
        # 0 = already formatted, non-zero = drift (it prints nothing — do
        # NOT diff its stdout against the file). Assert exit 0 per file.
        run: |
          drift=0
          for f in src/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr; do
            [ -f "$f" ] || continue
            if ! cyrius fmt "$f" --check >/dev/null 2>&1; then
              echo "::error::needs fmt: $f (run 'cyrius fmt $f')"
              drift=$((drift + 1))
            fi
          done
          [ $drift -eq 0 ] || { echo "fmt drift: $drift file(s)"; exit 1; }

      - name: Vet
        run: cyrius vet src/main.cyr

      - name: Verify dist bundle in sync
        # dist/nous.cyr is committed (nous's consumer-facing bundle).
        # Regenerate it from [lib] modules and fail if the committed copy
        # is stale — a contributor who edits src/ must rebuild the bundle.
        run: |
          cyrius distlib
          if ! git diff --exit-code dist/nous.cyr; then
            echo "::error::dist/nous.cyr is stale — run 'cyrius distlib' and commit the result."
            exit 1
          fi
          echo "dist/nous.cyr in sync"

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/nous
          echo "nous: $(wc -c < build/nous) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/nous | grep -q "7f45 4c46"

      - name: Smoke test
        run: |
          ./build/nous | tee /tmp/smoke_output
          grep -q "all smoke checks passed" /tmp/smoke_output

      - name: Test suite
        # `cyrius test` prefixes its summary with a non-printable byte
        # (visible as `�`) — without `-a`/--text, GNU grep treats the
        # stream as binary and drops the matching line. Force text mode.
        #
        # Capture with `set +e` first: `cyrius test` returns the failure
        # COUNT as its exit code, so under the runner's default `set -e`
        # the `out=$(…)` assignment would abort the step *before* echoing
        # — hiding which assertions failed (this masked a sysdb apt-path
        # failure as a bare "exit code 2"). Always print the per-test
        # output, then assert on the `0 failed` summary line.
        run: |
          set +e
          out=$(cyrius test tests/nous.tcyr 2>&1)
          rc=$?
          set -e
          echo "$out"
          echo "cyrius test exit code: $rc"
          echo "$out" | grep -a -E "passed,.*failed" | grep -a -q "0 failed"

      - name: Fuzz harness
        run: cyrius test tests/nous.fcyr

      - name: Bench
        # Non-fatal: numbers go to bench-history.csv and the artifact upload.
        run: |
          if [ -x scripts/bench-history.sh ]; then
            sh scripts/bench-history.sh "ci-${GITHUB_SHA::7}" || true
          else
            cyrius bench tests/nous.bcyr 2>&1 | tee bench-output.txt || true
          fi
        continue-on-error: true

      - name: Upload bench artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-history
          path: |
            bench-history.csv
            bench-output.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-x86_64
          path: build/nous
          retention-days: 5

  integration:
    name: Integration (apt)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Same hardened install as the build job (see comments there).
        run: |
          set -e
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          TARBALL="cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          URL="https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/$TARBALL"
          HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" -I "$URL")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "::error::Cyrius release $CYRIUS_VERSION not found on GitHub (HTTP $HTTP_CODE)."
            echo "::error::Asset URL: $URL"
            exit 1
          fi
          curl -sLO "$URL"
          if ! file "$TARBALL" | grep -q "gzip compressed"; then
            echo "::error::Downloaded $TARBALL is not a gzip archive."
            head -c 200 "$TARBALL" || true
            exit 1
          fi
          tar xzf "$TARBALL"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/" 2>/dev/null || true
          cp "$CYRIUS_DIR/scripts/cyrius" "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/cyrius" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib/" 2>/dev/null || true
          chmod +x "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"* 2>/dev/null || true
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/bin"
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" "$HOME/.cyrius/lib"
          echo "$CYRIUS_VERSION" > "$HOME/.cyrius/current"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Setup lib symlink
        run: ln -sf "$HOME/.cyrius/lib" lib

      - name: Verify apt tools available
        run: which apt-cache && which dpkg-query && echo "apt tools available"

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/nous

      - name: Run test suite (includes integration_apt)
        run: cyrius test tests/nous.tcyr

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for dangerous patterns
        # Match code lines only — strip comments so an inline `# `
        # comment doesn't mask a real call.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          scan "raw system()"   '\bsystem\s*\('
          scan "shell exec_str" '\bexec_str\s*\('
          # nous shells out to apt-cache/dpkg-query via array-based
          # exec_capture only — flag any string-form shell call.
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md \
                   LICENSE CLAUDE.md cyrius.cyml \
                   docs/api.md docs/architecture/overview.md \
                   docs/development/roadmap.md; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        # cyrius.cyml pulls package.version from VERSION via
        # ${file:VERSION}; just check VERSION appears in CHANGELOG.
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -q "$VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent (manifest pulls VERSION via \${file:VERSION})"
